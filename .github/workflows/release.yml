name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # npm >= 11.5 is required for OIDC Trusted Publishing (no NPM_TOKEN needed
      # once each package's Trusted Publisher is configured on npmjs.com).
      - run: npm install -g npm@latest
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          # `pnpm version` resolves to pnpm's builtin (needs a semver arg) —
          # `run` forces the package.json script (changeset version).
          version: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
